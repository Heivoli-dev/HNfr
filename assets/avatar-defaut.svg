<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Membre Heivoli Network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d95ff"/>
      <stop offset="1" stop-color="#4034c4"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".34" cy=".2" r=".42">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2defb"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="50" cy="50" r="50"/></clipPath>
    <clipPath id="globe"><circle cx="50" cy="34" r="17.5"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <rect width="100" height="100" fill="url(#gloss)"/>
    <!-- Corps -->
    <path d="M15 104 C15 75 30 59.5 50 59.5 C70 59.5 85 75 85 104 Z" fill="url(#body)"/>
    <g transform="translate(50 34) scale(1.13) translate(-50 -34)">
    <!-- Tête : globe -->
    <circle cx="50" cy="34" r="19" fill="#fff"/>
    <g clip-path="url(#globe)" fill="none" stroke="#b9b3ef" stroke-width="1.6">
      <ellipse cx="50" cy="34" rx="8.5" ry="17.5"/>
      <path d="M31 25.5 H69 M31 42.5 H69"/>
    </g>
    <circle cx="50" cy="34" r="18.2" fill="none" stroke="#5a4bd8" stroke-width="1.8"/>
    <!-- hn -->
    <g fill="none" stroke="#282639" stroke-width="4.4" stroke-linecap="butt" stroke-linejoin="round">
      <path d="M38.6 21.5 V44"/>
      <path d="M38.6 35.6 Q38.6 30.2 43.3 30.2 Q47.8 30.2 47.8 35.6 V44"/>
      <path d="M52.6 44 V30.4"/>
      <path d="M52.6 35.6 Q52.6 30.2 57.3 30.2 Q61.8 30.2 61.8 35.6 V44"/>
    </g>
    <!-- Les trois traits de couleur -->
    <rect x="58.4" y="22.6" width="2.6" height="4" rx=".6" fill="#05a0f5" transform="rotate(4 59.7 24.6)"/>
    <rect x="62.6" y="23.9" width="2.6" height="4" rx=".6" fill="#9dd209" transform="rotate(32 63.9 25.9)"/>
    <rect x="65.6" y="27.4" width="2.6" height="4" rx=".6" fill="#ec0f2b" transform="rotate(60 66.9 29.4)"/>
    </g>
  </g>
</svg>
